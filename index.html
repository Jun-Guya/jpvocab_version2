<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>일본어 단어장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#A6DAF4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F9FD; --paper:#FFFFFF; --hero:#BFDAF7; --chip:#DCEBF8;
  --ink:#16364B; --sub:#5A7A90; --line:#AAD1E7;
  --bar:#A6DAF4; --onbar:#0F3550;
  --cta:#00AFF0; --bar2:#0091C7; --oncta:#06324A; --brown2:#0077A8;
  --beni:#E07A5F;
  --ok:#2F9E6E; --okbg:#E4F6EE;
  --ng:#D9534F; --ngbg:#FDECEA;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1B24; --paper:#162631; --hero:#1A3348; --chip:#1F3848;
  --ink:#E4F2FA; --sub:#8FB0C4; --line:#2A4A60;
  --bar:#1F4A63; --onbar:#EAF6FC;
  --cta:#00AFF0; --bar2:#0080B0; --oncta:#06324A; --brown2:#A6DAF4;
  --ok:#6FD3A6; --okbg:#173328; --ng:#F2877F; --ngbg:#3A2322; --beni:#F2A08A;
}}
:root[data-theme="dark"]{
  --bg:#0F1B24; --paper:#162631; --hero:#1A3348; --chip:#1F3848;
  --ink:#E4F2FA; --sub:#8FB0C4; --line:#2A4A60;
  --bar:#1F4A63; --onbar:#EAF6FC;
  --cta:#00AFF0; --bar2:#0080B0; --oncta:#06324A; --brown2:#A6DAF4;
  --ok:#6FD3A6; --okbg:#173328; --ng:#F2877F; --ngbg:#3A2322; --beni:#F2A08A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Noto Sans CJK JP","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--brown2);outline-offset:2px}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.on{display:flex}
.bar{background:var(--bar);color:var(--onbar);padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar h2{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--onbar);flex:none}
.icon:active{background:rgba(15,53,80,.1)}
.wrap{padding:16px;flex:1;width:100%;max-width:680px;margin:0 auto}


/* home */
.hero{background:var(--hero);padding:30px 22px 26px;position:relative;overflow:hidden}
.hero h1{position:relative;margin:0;font-size:42px;letter-spacing:.06em;font-weight:800;color:var(--ink)}
.hero p{margin:4px 0 0;color:var(--sub);font-size:14px}
.prog{margin-top:22px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--sub)}
.prog .row b{font-size:22px;color:var(--ink)}
.track{height:10px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--cta);border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.stat{background:var(--paper);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mbtn{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left}
.mbtn:active{transform:translateY(1px)}
.mbtn .k{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;background:var(--chip);color:var(--brown2)}
.mbtn .t{flex:1;min-width:0}
.mbtn .t b{display:block;font-size:17px}
.mbtn .t small{color:var(--sub);font-size:13px}
.mbtn.main{background:var(--cta);border-color:var(--cta);color:var(--oncta);box-shadow:0 3px 0 var(--bar2)}
.mbtn.main .k{background:rgba(255,255,255,.5);color:var(--oncta)}
.mbtn.main small{color:var(--oncta);opacity:.85}
.k.a{color:var(--ng)!important;background:var(--ngbg)!important}
.help{font-size:12.5px;color:var(--sub);line-height:1.8;margin:16px 4px 24px}
.help code{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:inherit;color:var(--ink)}

/* quiz */
.qtop{background:var(--bar);padding:0 14px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4}
.qtop .row{display:flex;justify-content:space-between;color:var(--onbar);font-size:14px;margin-bottom:6px}
.qtop .row b{font-size:16px}
.score{display:flex;gap:10px;font-weight:700}
.score .o{color:var(--onbar)} .score .x{color:var(--onbar)}
.qtop .track{background:rgba(15,53,80,.15);height:6px;margin:0}
.qtop .track i{background:var(--cta)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 18px 26px;text-align:center;position:relative}
.qlabel{display:inline-block;font-size:13px;font-weight:700;color:var(--brown2);background:var(--chip);border-radius:99px;padding:5px 12px}
.prompt{margin:22px 0 6px;font-weight:700;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.prompt.kanji{font-size:60px}
.prompt.kana{font-size:40px}
.prompt.meaning{font-size:30px}
.speak{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;min-height:60px;padding:10px 14px 10px 52px;
  font-size:20px;font-weight:600;text-align:left;position:relative;transition:background .15s,border-color .15s}
.opt::before{content:attr(data-n);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  background:var(--chip);color:var(--sub);font-size:14px;display:grid;place-items:center;font-weight:700}
.opt.kanji{font-size:24px}
.opt:active{background:var(--chip)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.right::before{content:"○";background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.opt.wrong::before{content:"✕";background:var(--ng);color:#fff}
.opt.dim{opacity:.45}
.opt[disabled]{pointer-events:none}

.mark{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20;opacity:0}
.mark.show{animation:mark .9s ease forwards}
.mark .o{width:190px;height:190px;border:26px solid var(--ok);border-radius:50%}
.mark .x{width:200px;height:200px;position:relative}
.mark .x::before,.mark .x::after{content:"";position:absolute;left:50%;top:50%;width:220px;height:28px;border-radius:14px;background:var(--ng);transform:translate(-50%,-50%) rotate(45deg)}
.mark .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes mark{0%{opacity:0;transform:scale(.6)}25%{opacity:.92;transform:scale(1.05)}40%{transform:scale(1)}75%{opacity:.92}100%{opacity:0}}

.result{margin-top:16px;display:none}
.result.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{font-weight:800;font-size:16px;margin-bottom:10px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.notice{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;border:2px solid}
.notice .ic{font-size:34px;flex:none;line-height:1}
.notice b{display:block;font-size:18px}
.notice p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--ink)}
.notice.grad{background:var(--okbg);border-color:var(--ok)} .notice.grad b{color:var(--ok)}
.notice.half{background:var(--chip);border-color:var(--brown2)} .notice.half b{color:var(--brown2)}
.notice.bad{background:var(--ngbg);border-color:var(--ng)} .notice.bad b{color:var(--ng)}
.dots{display:inline-flex;gap:5px;margin-left:6px;vertical-align:middle}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.dots i.f{background:currentColor}
.full{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px}
.full .w{flex:1}
.full .wk{font-size:30px;font-weight:800}
.full .wr{font-size:16px;color:var(--brown2);margin-top:2px}
.full .wm{font-size:16px;margin-top:6px}
.exh{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 8px}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}

.ex .jp{font-size:17px;line-height:1.55}
.ex .jp b{color:var(--beni)}
.ex .ko{font-size:14px;color:var(--sub);margin-top:3px}
.ex .s{flex:none;font-size:15px;width:32px;height:32px;border-radius:50%;background:var(--bg)}
.noex{color:var(--sub);font-size:14px;padding:6px 4px}
.next{width:100%;margin:14px 0 24px;background:var(--cta);color:var(--oncta);border-radius:14px;padding:17px;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--bar2)}
.next:active{transform:translateY(2px);box-shadow:none}
.next.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none;margin-top:0}

.done{text-align:center;padding:30px 10px 10px}
.done .big{font-size:56px}
.done h3{font-size:24px;margin:10px 0 4px}
.done p{color:var(--sub);margin:0}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}

/* list & review */
.search{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.search:focus{border-color:var(--brown2)}
.cnt{font-size:13px;color:var(--sub);margin:12px 4px 8px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.item .w{flex:1;min-width:0}
.item .l1{font-size:19px;font-weight:700}
.item .l1 small{font-size:14px;color:var(--brown2);font-weight:500;margin-left:6px}
.item .l2{font-size:14px;color:var(--sub);margin-top:2px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.tag.n{color:var(--ng);background:var(--ngbg)} .tag.d{color:var(--brown2);background:var(--chip)}
.rec{font-size:12px;color:var(--sub);white-space:nowrap}
.del{width:34px;height:34px;border-radius:50%;color:var(--sub);font-size:16px;flex:none}
.danger{display:flex;gap:8px;margin:18px 0 30px}
.danger button{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--sub);background:var(--paper)}
.rhead{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.rhead b{font-size:34px;display:block}
.rhead span{color:var(--sub);font-size:14px}
.rhead .next{margin:14px 0 0}
.sec{font-size:14px;font-weight:700;color:var(--sub);margin:22px 4px 10px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.day .dh{display:flex;align-items:center;gap:10px;padding:14px}
.day .dt{flex:1;text-align:left}
.day .dt b{display:block;font-size:16px}
.day .dt small{color:var(--sub);font-size:13px}
.day .go{background:var(--cta);color:var(--oncta);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;flex:none}
.day .dl{border-top:1px solid var(--line);padding:6px 14px 10px;display:none}
.day.open .dl{display:block}
.day .wrow{display:flex;gap:8px;padding:6px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.day .wrow:last-child{border:0}
.day .wrow span:first-child{font-weight:700;min-width:30%}
.day .wrow span:nth-child(2){color:var(--brown2);min-width:30%}
.empty{text-align:center;color:var(--sub);padding:30px 10px;line-height:1.7}

/* modal, picker & toast */
.modal{position:fixed;inset:0;background:rgba(15,53,80,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.sheet h3{margin:0 0 8px;font-size:19px}
.sheet .mm{color:var(--sub);font-size:15px;line-height:1.6}
.mb{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:var(--chip)}
.btn.pri{background:var(--cta);color:var(--oncta)}
.btn.red{background:var(--ng);color:#fff}
.pk{text-align:center;color:var(--ink)}
.pkn{font-size:18px;margin:6px 0 12px}
.pkn b{font-size:52px;font-weight:800}
.pk input[type=range]{width:100%;accent-color:var(--cta);height:30px}
.pkr{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--line);border-radius:99px;padding:8px 14px;font-size:15px;font-weight:700;background:var(--paper)}
.chip.on{background:var(--cta);border-color:var(--cta);color:var(--oncta)}
.pkhint{font-size:13px;color:var(--sub);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:14px 20px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:.25s;z-index:40;max-width:88%;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (min-width:700px){
  .wrap{padding:24px}
  .hero{padding-left:calc(50% - 316px);padding-right:calc(50% - 316px)}
  .qtop,.bar{padding-left:calc(50% - 330px);padding-right:calc(50% - 330px)}
  .prompt.kanji{font-size:76px}
  .opt{font-size:22px;min-height:66px}
}
/* ---- v2: 일차 구조 ---- */
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.tcard .th{display:flex;align-items:center;gap:8px}
.tcard .th b{font-size:18px;flex:1}
.tcard .rng{font-size:14px;color:var(--brown2);font-weight:700;background:var(--chip);border-radius:99px;padding:5px 12px}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tb{background:var(--chip);border-radius:14px;padding:14px 10px;text-align:center;min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tb b{font-size:16px}
.tb small{font-size:12px;color:var(--sub)}
.tb.main{background:var(--cta);color:var(--oncta);box-shadow:0 3px 0 var(--bar2)}
.tb.main small{color:var(--oncta);opacity:.85}
.tb.note b{color:var(--ng)}
.tb:active{transform:translateY(1px)}
.sech{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 10px}
.sech b{font-size:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 보기 1: 격자 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;text-align:center;position:relative}
.dc b{display:block;font-size:17px}
.dc small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.dc .mini{height:5px;border-radius:99px;background:var(--chip);margin-top:8px;overflow:hidden}
.dc .mini i{display:block;height:100%;background:var(--cta)}
.dc .nb{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--ng);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.dc.complete{border-color:var(--cta);background:var(--chip)}
.dc.complete b::after{content:" ✓";color:var(--cta)}
.dc.nowords{opacity:.4}
/* 보기 2: 목록 */
.drow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.drow .top{display:flex;align-items:baseline;gap:8px}
.drow .top b{font-size:17px}
.drow .top small{font-size:13px;color:var(--sub);flex:1}
.drow .mini{height:5px;border-radius:99px;background:var(--chip);margin:8px 0 10px;overflow:hidden}
.drow .mini i{display:block;height:100%;background:var(--cta)}
.drow .bs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.drow .bs button{background:var(--chip);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:700}
.drow .bs button.m{background:var(--cta);color:var(--oncta)}
.drow .bs button.n{color:var(--ng)}
.drow.nowords{opacity:.4}
.drow.nowords .bs{display:none}
/* 일차 화면 */
.dstat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dstat4 .stat b{font-size:20px}
.dbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sel{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}
.sel select{font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:120px}
.sel span{font-size:18px;color:var(--sub)}
.rinfo{text-align:center;font-size:15px;color:var(--sub);margin-top:6px}
.rinfo b{color:var(--ink)}
.qchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.lfilter{display:flex;gap:8px;margin-bottom:10px}
.lfilter select{font:inherit;font-size:15px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.dayword{display:flex;gap:8px;padding:9px 0;font-size:15px;border-bottom:1px dashed var(--line);align-items:center}
.dayword span:first-child{font-weight:700;min-width:28%}
.dayword span:nth-child(2){color:var(--brown2);min-width:28%}
.dayword span:nth-child(3){flex:1}

.tb.card{background:var(--hero)}
.tb.card b::before{content:"🃏 "}
.drow .bs{grid-template-columns:repeat(4,1fr)!important}
.drow .bs button.c{background:var(--hero)}
/* 카드 뒤집기 */
.fnum{font-weight:700;font-size:15px;white-space:nowrap}
.ftrack{height:6px;border-radius:99px;background:rgba(15,53,80,.15);margin:0 14px 12px;overflow:hidden}
.fwrap{background:var(--bar);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;padding-bottom:1px}
.ftrack i{display:block;height:100%;background:var(--cta);transition:width .3s}
.flip{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip .inner{display:grid;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip .inner.on{transform:rotateY(180deg)}
.flip .inner.noanim{transition:none}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 18px;min-height:380px;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--line)}
.face.front{align-items:center;justify-content:center;text-align:center;position:relative}
.face.back{transform:rotateY(180deg)}
.face .fl{font-size:13px;font-weight:700;color:var(--brown2);background:var(--chip);border-radius:99px;padding:5px 12px}
.face .ft{font-weight:800;margin:26px 0 10px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.face .ft.kanji{font-size:72px} .face .ft.kana{font-size:44px} .face .ft.meaning{font-size:34px}
.face .fh{color:var(--sub);font-size:14px;margin-top:auto;padding-top:20px}
.fhead{text-align:center;font-weight:800;font-size:26px;line-height:1.5;padding:6px 0 4px}
.fhead .dot{color:var(--sub);font-weight:400;margin:0 4px}
.fhead .rd{color:var(--brown2)}
.fmeta{text-align:center;margin-bottom:12px}
.face.back .ex{background:var(--bg);border-color:transparent}
.fbtns{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin:14px 0 24px}
.fbtns button{border-radius:14px;padding:16px 10px;font-size:16px;font-weight:700}
.fbtns .prev{background:var(--paper);border:2px solid var(--line);padding:16px 16px}
.fbtns .no{background:var(--ngbg);color:var(--ng);border:2px solid var(--ng)}
.fbtns .yes{background:var(--cta);color:var(--oncta);box-shadow:0 3px 0 var(--bar2)}
.fbtns button:disabled{opacity:.35}
.pos-v{background:#E8F3FB;color:#2B6CA3}
.pos-adv{background:#F1ECFA;color:#6A4BB0}
.lsum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;color:var(--sub);line-height:1.6}
.lsum b{color:var(--ink)}

.ex .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--cta);color:#fff!important;font-size:13px;font-weight:700;line-height:1;
  display:flex!important;align-items:center;justify-content:center;padding:0;margin-top:2px;font-family:Arial,"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}

.pos-i{background:#FFF1DC;color:#B7791F}
.pos-c{background:#EEF0F3;color:#4A5568}
.pos-e{background:#FCEAF2;color:#B83280}
.pos-k{background:#E6F6F1;color:#2C7A6B}

.dc{display:block;white-space:nowrap}
.dc b,.dc small{white-space:nowrap}

.pos{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;vertical-align:middle}
.pos-n{background:var(--chip);color:var(--brown2)}
.pos-s{background:#E3F6EC;color:#2F8A60}
.pos-na{background:#FDF1E3;color:#B8661F}

<!-- HOME -->
<section class="screen on" id="home">
  <div class="hero">
    <h1>単語帳</h1>
    <p>일본어 단어 4지선다 암기</p>
    <div class="prog">
      <div class="row"><span>전체 진도</span><span><b id="pDone">0</b> / <span id="pTotal">0</span></span></div>
      <div class="track"><i id="pBar" style="width:0"></i></div>
    </div>
  </div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span>오늘 푼 단어</span></div>
      <div class="stat"><b id="sNote">0</b><span>전체 오답노트</span></div>
      <div class="stat"><b id="sRate">-</b><span>정답률</span></div>
    </div>

    <div class="tcard">
      <div class="th"><b>오늘의 학습</b><span class="rng" id="tRange">범위 미선택</span></div>
      <div class="tbtns">
        <button class="tb main" onclick="todayLearn()"><b>문제 풀기</b><small id="tLearnSub">범위 고르기</small></button>
        <button class="tb card" onclick="todayFlash()"><b>카드 뒤집기</b><small id="tCardSub">보고 떠올리기</small></button>
        <button class="tb" onclick="todayReview()"><b>복습하기</b><small id="tRevSub">-</small></button>
        <button class="tb note" onclick="todayNote()"><b>오답노트</b><small id="tNoteSub">-</small></button>
      </div>
    </div>

    <div class="sech"><b>일차별 학습</b>
      <span class="seg"><button id="lyA" onclick="setLayout('A')">보기 1</button><button id="lyB" onclick="setLayout('B')">보기 2</button></span>
    </div>
    <div id="days"></div>

    <div class="menu" style="margin-top:24px">
      <button class="mbtn" onclick="openList()">
        <span class="k">覧</span><span class="t"><b>단어 목록</b><small>검색, 삭제, 백업</small></span>
      </button>
      <button class="mbtn" onclick="$('#file').click()">
        <span class="k">⇪</span><span class="t"><b>엑셀 불러오기</b><small>시트 이름(1일차, 2일차…)으로 일차가 나뉘어요</small></span>
      </button>
    </div>
    <div class="help">
      엑셀 형식: 시트 이름 <code>1일차</code> ~ <code>41일차</code>, 한 줄에 한 단어<br>
      <code>A 한자</code> <code>B 히라가나</code> <code>C 뜻</code> <code>D~F 예문</code><br>
      예문은 <code>日本語の文 / 한국어 뜻</code> 처럼 슬래시로 나눠 쓰세요.
    </div>
  </div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv">
</section>

<!-- DAY -->
<section class="screen" id="day">
  <div class="bar">
    <button class="icon" onclick="goHome()" aria-label="뒤로">←</button>
    <h2 id="dTitle">1일차</h2>
  </div>
  <div class="wrap" id="dBody"></div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <div class="bar">
    <button class="icon" onclick="quitQuiz()" aria-label="그만하기">✕</button>
    <h2 id="qMode"></h2>
    <button class="icon" id="sndBtn" onclick="toggleSound()" aria-label="소리 켜기/끄기">🔔</button>
  </div>
  <div class="qtop">
    <div class="row"><span><b id="qNum">1</b> / <span id="qTot">1</span></span>
      <span class="score"><span class="o">○ <span id="scO">0</span></span><span class="x">✕ <span id="scX">0</span></span></span></div>
    <div class="track"><i id="qBar" style="width:0"></i></div>
  </div>
  <div class="wrap" id="qMain">
    <div class="card">
      <button class="speak" id="qSpeak" aria-label="발음 듣기">🔊</button>
      <span class="qlabel" id="qLabel"></span>
      <div class="prompt" id="qPrompt"></div>
      <div class="qpos" id="qPos"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="result" id="result"></div>
  </div>
  <div class="wrap" id="qDone" style="display:none"></div>
</section>

<!-- FLASH -->
<section class="screen" id="flash">
  <div class="bar">
    <button class="icon" onclick="quitFlash()" aria-label="그만하기">✕</button>
    <h2 id="fTitle">카드 뒤집기</h2>
    <span class="fnum" id="fNum">1 / 1</span>
  </div>
  <div class="fwrap"><div class="ftrack"><i id="fBar" style="width:0"></i></div></div>
  <div class="wrap" id="fMain">
    <div class="flip" id="flip" onclick="flipCard()"><div class="inner" id="fInner">
      <div class="face front" id="fFront"></div>
      <div class="face back" id="fBack"></div>
    </div></div>
    <div class="fbtns">
      <button class="prev" id="fPrev" onclick="flashMove(-1)" aria-label="이전 카드">◀</button>
      <button class="no" onclick="flashMark(false)">몰랐어요</button>
      <button class="yes" onclick="flashMark(true)">알았어요</button>
    </div>
  </div>
  <div class="wrap" id="fDone" style="display:none"></div>
</section>

<!-- LIST -->
<section class="screen" id="list">
  <div class="bar">
    <button class="icon" onclick="goHome()" aria-label="뒤로">←</button>
    <h2>단어 목록</h2>
  </div>
  <div class="wrap">
    <div class="lfilter"><select id="lDay" onchange="renderList()"></select>
      <input class="search" id="q" placeholder="한자, 히라가나, 뜻으로 검색" oninput="renderList()"></div>
    <div class="lsum" id="lsum"></div>
    <div class="cnt" id="cnt"></div>
    <div id="items"></div>
    <div class="sec">백업</div>
    <div class="danger" style="margin-top:0">
      <button onclick="exportBackup()">백업 파일 저장</button>
      <button onclick="$('#bfile').click()">백업에서 복원</button>
    </div>
    <input type="file" id="bfile" accept=".json,application/json">
    <div class="sec">초기화</div>
    <div class="danger" style="margin-top:0">
      <button onclick="resetStats()">학습 기록 초기화</button>
      <button onclick="deleteAll()">단어 전체 삭제</button>
    </div>
  </div>
</section>

이 금방 퍼졌다.","その習慣は全国に広まった。 / 그 관습은 전국으로 퍼졌다.","ネットで情報が広まる。 / 인터넷으로 정보가 퍼진다."],"동사 (動詞)"],[5,"構える","かまえる","자세를 취하다, 차리다",["カメラを構える。 / 카메라를 겨눈다.","駅前に店を構えた。 / 역 앞에 가게를 차렸다.","そんなに構えなくても大丈夫だ。 / 그렇게 긴장하지 않아도 괜찮다."],"동사 (動詞)"],[5,"行う","おこなう","행하다, 실시하다",["来週、試験を行う。 / 다음 주에 시험을 실시한다.","卒業式は体育館で行われた。 / 졸업식은 체육관에서 거행되었다.","調査を行った結果、問題が見つかった。 / 조사를 실시한 결과 문제가 발견되었다."],"동사 (動詞)"],[5,"合わす","あわす","맞추다, 합치다",["みんなで力を合わす。 / 모두 힘을 합친다.","時計の時間を合わす。 / 시계 시간을 맞춘다.","二人は顔を合わすたびにけんかする。 / 두 사람은 얼굴을 마주칠 때마다 싸운다."],"동사 (動詞)"],[5,"込める","こめる","담다",["心を込めて手紙を書いた。 / 마음을 담아 편지를 썼다.","願いを込めて祈る。 / 소원을 담아 기도한다.","力を込めてドアを押した。 / 힘을 주어 문을 밀었다."],"동사 (動詞)"],[5,"削る","けずる","깎다, 삭감하다",["鉛筆を削る。 / 연필을 깎는다.","予算を削る。 / 예산을 삭감한다.","睡眠時間を削って勉強した。 / 수면 시간을 줄여 공부했다."],"동사 (動詞)"],[5,"仕上げる","しあげる","마무리하다, 완성하다",["今日中にレポートを仕上げる。 / 오늘 중으로 리포트를 마무리한다.","丁寧に仕上げた作品だ。 / 정성껏 완성한 작품이다.","最後に塩で味を仕上げる。 / 마지막으로 소금으로 맛을 마무리한다."],"동사 (動詞)"],[5,"支える","ささえる","지탱하다, 지원하다",["家族に支えられて頑張れた。 / 가족의 지지 덕분에 힘낼 수 있었다.","柱が屋根を支えている。 / 기둥이 지붕을 지탱하고 있다.","彼は一人で家計を支えている。 / 그는 혼자서 가계를 떠받치고 있다."],"동사 (動詞)"],[5,"試みる","こころみる","시도하다",["新しい方法を試みた。 / 새로운 방법을 시도했다.","何度も説得を試みた。 / 몇 번이나 설득을 시도했다.","脱出を試みたが失敗した。 / 탈출을 시도했지만 실패했다."],"동사 (動詞)"],[5,"謝る","あやまる","사과하다",["遅れたことを謝った。 / 늦은 것을 사과했다.","素直に謝れば許してもらえる。 / 솔직하게 사과하면 용서받을 수 있다.","謝っても遅い。 / 사과해도 늦었다."],"동사 (動詞)"],[5,"収まる","おさまる","담기다, 수습되다, 가라앉다",["荷物が全部箱に収まった。 / 짐이 전부 상자에 들어갔다.","騒ぎがやっと収まった。 / 소동이 드디어 가라앉았다.","怒りが収まらない。 / 분노가 가라앉지 않는다."],"동사 (動詞)"],[5,"従う","したがう","따르다",["ルールに従って行動する。 / 규칙에 따라 행동한다.","親の意見に従った。 / 부모님의 의견에 따랐다.","時代が進むに従って生活が変わる。 / 시대가 흐름에 따라 생활이 바뀐다."],"동사 (動詞)"],[5,"巡る","めぐる","돌다, 둘러싸다",["京都の寺を巡る旅をした。 / 교토의 절을 도는 여행을 했다.","季節が巡る。 / 계절이 돌아온다.","遺産を巡って争いが起きた。 / 유산을 둘러싸고 다툼이 일어났다."],"동사 (動詞)"],[5,"除く","のぞく","제외하다, 없애다",["日曜日を除いて毎日営業している。 / 일요일을 제외하고 매일 영업하고 있다.","不安を取り除く。 / 불안을 없앤다.","私を除いて全員が賛成した。 / 나를 제외하고 전원이 찬성했다."],"동사 (動詞)"],[5,"傷つく","きずつく","상처받다, 상처 나다",["彼の言葉に傷ついた。 / 그의 말에 상처받았다.","車が傷ついてしまった。 / 차에 흠집이 나 버렸다.","傷つきやすい性格だ。 / 상처받기 쉬운 성격이다."],"동사 (動詞)"],[5,"招く","まねく","초대하다, 초래하다",["友達を家に招いた。 / 친구를 집에 초대했다.","彼の発言が誤解を招いた。 / 그의 발언이 오해를 불러일으켰다.","専門家を講師に招く。 / 전문가를 강사로 초빙한다."],"동사 (動詞)"],[5,"焼ける","やける","타다, 구워지다",["パンがおいしく焼けた。 / 빵이 맛있게 구워졌다.","火事で家が焼けた。 / 화재로 집이 탔다.","海で日に焼けた。 / 바다에서 햇볕에 탔다."],"동사 (動詞)"],[5,"触れる","ふれる","닿다, 접하다, 언급하다",["展示品に手を触れないでください。 / 전시품에 손대지 마세요.","外国の文化に触れる。 / 외국 문화를 접한다.","その問題には触れないでおこう。 / 그 문제는 언급하지 않기로 하자."],"동사 (動詞)"],[5,"伸ばす","のばす","뻗다, 늘리다, 기르다",["手を伸ばして本を取る。 / 손을 뻗어 책을 집는다.","髪を伸ばしている。 / 머리를 기르고 있다.","才能を伸ばす。 / 재능을 키운다."],"동사 (動詞)"],[5,"心掛ける","こころがける","명심하다, 유의하다",["健康的な食事を心掛けている。 / 건강한 식사를 유념하고 있다.","安全運転を心掛ける。 / 안전 운전을 명심한다.","早寝早起きを心掛けよう。 / 일찍 자고 일찍 일어나는 것을 신경 쓰자."],"동사 (動詞)"],[5,"深まる","ふかまる","깊어지다",["秋が深まってきた。 / 가을이 깊어졌다.","二人の友情が深まった。 / 두 사람의 우정이 깊어졌다.","謎がますます深まる。 / 수수께끼가 점점 깊어진다."],"동사 (動詞)"],[5,"深める","ふかめる","깊게 하다",["理解を深める。 / 이해를 깊게 한다.","交流を通して友好を深める。 / 교류를 통해 우호를 다진다.","知識を深めるために本を読む。 / 지식을 넓히기 위해 책을 읽는다."],"동사 (動詞)"],[5,"親しむ","したしむ","친해지다, 친숙해지다",["子どもの頃から自然に親しむ。 / 어릴 때부터 자연과 친숙해진다.","音楽に親しむ生活を送る。 / 음악과 가까이하는 생활을 한다.","長年親しんできた店が閉店した。 / 오랫동안 정들었던 가게가 문을 닫았다."],"동사 (動詞)"],[5,"震える","ふるえる","떨리다",["寒くて体が震える。 / 추워서 몸이 떨린다.","緊張で声が震えた。 / 긴장으로 목소리가 떨렸다.","恐怖で手が震えた。 / 공포로 손이 떨렸다."],"동사 (動詞)"],[5,"震わせる","ふるわせる","떨게 하다, 떨다",["彼女は肩を震わせて泣いた。 / 그녀는 어깨를 떨며 울었다.","怒りに声を震わせた。 / 분노로 목소리를 떨었다.","大きな音が窓を震わせた。 / 큰 소리가 창문을 흔들었다."],"동사 (動詞)"],[5,"図る","はかる","도모하다, 꾀하다",["問題の解決を図る。 / 문제의 해결을 도모한다.","業務の効率化を図る。 / 업무 효율화를 꾀한다.","両国の協力を図る。 / 두 나라의 협력을 도모한다."],"동사 (動詞)"],[5,"整える","ととのえる","정돈하다, 갖추다",["服装を整えてから出かける。 / 옷차림을 정돈하고 나서 나간다.","体調を整える。 / 몸 상태를 조절한다.","準備を整えて待つ。 / 준비를 갖추고 기다린다."],"동사 (動詞)"],[5,"生かす","いかす","살리다",["経験を生かして働く。 / 경험을 살려서 일한다.","素材の味を生かした料理だ。 / 재료의 맛을 살린 요리다.","このチャンスを生かしたい。 / 이 기회를 살리고 싶다."],"동사 (動詞)"],[5,"生じる","しょうじる","생기다, 발생하다",["誤解が生じた。 / 오해가 생겼다.","問題が生じたら連絡してください。 / 문제가 생기면 연락해 주세요.","計画に遅れが生じている。 / 계획에 지연이 발생하고 있다."],"동사 (動詞)"],[5,"責める","せめる","나무라다, 비난하다",["自分を責めないでください。 / 자신을 탓하지 마세요.","失敗した部下を責めた。 / 실수한 부하를 나무랐다.","誰も彼を責められない。 / 아무도 그를 비난할 수 없다."],"동사 (動詞)"],[5,"設ける","もうける","마련하다, 설치하다",["話し合いの場を設ける。 / 대화의 자리를 마련한다.","会場に受付を設けた。 / 행사장에 접수처를 설치했다.","新しい規則を設ける。 / 새 규칙을 만든다."],"동사 (動詞)"],[5,"占める","しめる","차지하다",["女性が社員の半分を占めている。 / 여성이 사원의 절반을 차지하고 있다.","賛成が多数を占めた。 / 찬성이 다수를 차지했다.","窓際の席を占める。 / 창가 자리를 차지한다."],"동사 (動詞)"],[5,"染まる","そまる","물들다",["夕日で空が赤く染まった。 / 석양으로 하늘이 붉게 물들었다.","悪い習慣に染まる。 / 나쁜 습관에 물든다.","山が紅葉に染まる。 / 산이 단풍으로 물든다."],"동사 (動詞)"],[5,"染める","そめる","물들이다, 염색하다",["髪を茶色に染めた。 / 머리를 갈색으로 염색했다.","布を青く染める。 / 천을 파랗게 물들인다.","彼女は顔を赤く染めた。 / 그녀는 얼굴을 붉혔다."],"동사 (動詞)"],[5,"狙う","ねらう","노리다, 겨누다",["優勝を狙う。 / 우승을 노린다.","泥棒は留守の家を狙う。 / 도둑은 빈집을 노린다.","的を狙って矢を放つ。 / 과녁을 겨누어 화살을 쏜다."],"동사 (動詞)"],[5,"組む","くむ","짜다, 끼다, 짝을 이루다",["友達とチームを組む。 / 친구와 팀을 짠다.","腕を組んで考える。 / 팔짱을 끼고 생각한다.","旅行の日程を組む。 / 여행 일정을 짠다."],"동사 (動詞)"],[5,"訴える","うったえる","호소하다, 고소하다",["痛みを訴えて病院に行った。 / 통증을 호소하며 병원에 갔다.","会社を裁判所に訴えた。 / 회사를 법원에 고소했다.","平和の大切さを訴える。 / 평화의 소중함을 호소한다."],"동사 (動詞)"],[5,"争う","あらそう","다투다, 경쟁하다",["兄弟で遺産を争う。 / 형제끼리 유산을 두고 다툰다.","二人は一位を争っている。 / 두 사람은 1위를 다투고 있다.","一刻を争う事態だ。 / 일각을 다투는 사태다."],"동사 (動詞)"],[5,"測る","はかる","재다, 측정하다",["体温を測る。 / 체온을 잰다.","部屋の広さを測った。 / 방의 넓이를 쟀다.","相手の気持ちを測るのは難しい。 / 상대의 마음을 헤아리는 것은 어렵다."],"동사 (動詞)"],[5,"代わる","かわる","대신하다, 바뀌다",["部長に代わって私が説明します。 / 부장님을 대신해서 제가 설명하겠습니다.","電話を代わりました。 / 전화 바꿨습니다.","石油に代わるエネルギーを探す。 / 석유를 대신할 에너지를 찾는다."],"동사 (動詞)"],[5,"奪う","うばう","빼앗다",["泥棒にかばんを奪われた。 / 도둑에게 가방을 빼앗겼다.","戦争は多くの命を奪った。 / 전쟁은 많은 생명을 앗아갔다.","美しい景色に目を奪われた。 / 아름다운 경치에 눈을 빼앗겼다."],"동사 (動詞)"],[5,"担う","になう","짊어지다, 맡다",["若者は未来を担っている。 / 젊은이들은 미래를 짊어지고 있다.","重要な役割を担う。 / 중요한 역할을 맡는다.","彼は会社の将来を担う人材だ。 / 그는 회사의 장래를 짊어질 인재다."],"동사 (動詞)"],[5,"探る","さぐる","탐색하다, 살피다, 더듬다",["ポケットを探って鍵を出した。 / 주머니를 더듬어 열쇠를 꺼냈다.","相手の本心を探る。 / 상대의 본심을 살핀다.","解決の方法を探る。 / 해결 방법을 모색한다."],"동사 (動詞)"],[5,"断つ","たつ","끊다",["酒を断つ決心をした。 / 술을 끊을 결심을 했다.","連絡を断って一人になった。 / 연락을 끊고 혼자가 되었다.","悪い関係を断つ。 / 나쁜 관계를 끊는다."],"동사 (動詞)"],[5,"断る","ことわる","거절하다, 양해를 구하다",["彼の誘いを断った。 / 그의 권유를 거절했다.","無理な頼みは断ってもいい。 / 무리한 부탁은 거절해도 된다.","断ってから部屋に入る。 / 양해를 구하고 나서 방에 들어간다."],"동사 (動詞)"],[5,"築く","きずく","쌓다, 구축하다",["信頼関係を築く。 / 신뢰 관계를 쌓는다.","彼は一代で財産を築いた。 / 그는 한 대에 재산을 쌓았다.","昔、ここに城が築かれた。 / 옛날 이곳에 성이 쌓였다."],"동사 (動詞)"],[6,"調える","ととのえる","갖추다, 마련하다, 조절하다",["塩で味を調える。 / 소금으로 간을 맞춘다.","旅行の準備を調える。 / 여행 준비를 갖춘다.","必要な書類を調えた。 / 필요한 서류를 마련했다."],"동사 (動詞)"],[6,"痛める","いためる","다치다, 아프게 하다",["重い荷物を持って腰を痛めた。 / 무거운 짐을 들어서 허리를 다쳤다.","大声を出して喉を痛めた。 / 큰 소리를 내서 목이 상했다.","子どものことで心を痛めている。 / 아이 일로 마음 아파하고 있다."],"동사 (動詞)"],[6,"通じる","つうじる","통하다",["私の日本語が通じた。 / 내 일본어가 통했다.","この道は駅に通じている。 / 이 길은 역으로 통한다.","電話が通じない。 / 전화가 연결되지 않는다."],"동사 (動詞)"],[6,"締める","しめる","조이다, 매다",["ネクタイを締める。 / 넥타이를 맨다.","シートベルトを締めてください。 / 안전벨트를 매 주세요.","ねじをしっかり締める。 / 나사를 단단히 조인다."],"동사 (動詞)"],[6,"諦める","あきらめる","포기하다, 단념하다",["最後まで諦めないで。 / 끝까지 포기하지 마.","留学を諦めた。 / 유학을 단념했다.","諦めるのはまだ早い。 / 포기하기는 아직 이르다."],"동사 (動詞)"],[6,"転がる","ころがる","구르다, 굴러가다",["ボールが坂を転がっていく。 / 공이 언덕을 굴러간다.","床に空き缶が転がっている。 / 바닥에 빈 캔이 굴러다니고 있다.","チャンスはどこにでも転がっている。 / 기회는 어디에나 널려 있다."],"동사 (動詞)"],[6,"努める","つとめる","힘쓰다, 노력하다",["健康の維持に努める。 / 건강 유지에 힘쓴다.","笑顔でいるように努めた。 / 웃는 얼굴로 있으려고 노력했다.","サービスの向上に努めます。 / 서비스 향상에 힘쓰겠습니다."],"동사 (動詞)"],[6,"倒す","たおす","쓰러뜨리다, 이기다",["風が木を倒した。 / 바람이 나무를 쓰러뜨렸다.","強い相手を倒して優勝した。 / 강한 상대를 이기고 우승했다.","座席を後ろに倒す。 / 좌석을 뒤로 젖힌다."],"동사 (動詞)"],[6,"踏まえる","ふまえる","근거로 하다, 감안하다",["前回の反省を踏まえて計画を立てる。 / 지난번 반성을 바탕으로 계획을 세운다.","現状を踏まえて判断する。 / 현 상황을 감안해서 판단한다.","事実を踏まえた意見だ。 / 사실에 근거한 의견이다."],"동사 (動詞)"],[6,"逃す","のがす","놓치다",["最終電車を逃した。 / 막차를 놓쳤다.","絶好のチャンスを逃した。 / 절호의 기회를 놓쳤다.","このセールは見逃せない。 / 이 세일은 놓칠 수 없다."],"동사 (動詞)"],[6,"曇る","くもる","흐리다, 흐려지다",["午後から空が曇ってきた。 / 오후부터 하늘이 흐려졌다.","湯気で眼鏡が曇った。 / 김 때문에 안경이 흐려졌다.","悪い知らせに彼の顔が曇った。 / 나쁜 소식에 그의 얼굴이 어두워졌다."],"동사 (動詞)"],[6,"納まる","おさまる","들어가다, 납입되다, 자리 잡다",["注文した品物が倉庫に納まった。 / 주문한 물건이 창고에 들어갔다.","会費はすべて納まった。 / 회비는 모두 납입되었다.","彼は社長の座に納まった。 / 그는 사장 자리에 앉았다."],"동사 (動詞)"],[6,"納める","おさめる","납부하다, 거두다",["税金を納める。 / 세금을 납부한다.","商品を期日までに納める。 / 상품을 기일까지 납품한다.","勝利を手中に納めた。 / 승리를 손에 넣었다."],"동사 (動詞)"],[6,"破る","やぶる","찢다, 깨다, 어기다",["手紙を破って捨てた。 / 편지를 찢어서 버렸다.","約束を破ってはいけない。 / 약속을 어겨서는 안 된다.","世界記録を破った。 / 세계 기록을 깼다."],"동사 (動詞)"],[6,"配る","くばる","나누어 주다, 배부하다",["駅前でチラシを配る。 / 역 앞에서 전단지를 나눠 준다.","先生が資料を配った。 / 선생님이 자료를 나눠 주셨다.","周りに気を配る。 / 주위를 배려한다."],"동사 (動詞)"],[6,"迫る","せまる","다가오다, 닥치다, 강요하다",["締め切りが迫っている。 / 마감이 다가오고 있다.","台風が迫ってきた。 / 태풍이 닥쳐왔다.","彼に返事を迫った。 / 그에게 대답을 강요했다."],"동사 (動詞)"],[6,"抜ける","ぬける","빠지다",["歯が抜けた。 / 이가 빠졌다.","タイヤの空気が抜けている。 / 타이어 바람이 빠져 있다.","トンネルを抜けると海が見えた。 / 터널을 빠져나가자 바다가 보였다."],"동사 (動詞)"],[6,"避ける","さける/よける","피하다",["混雑を避けて早く出かける。 / 혼잡을 피해 일찍 나간다.","車を避けて道の端を歩く。 / 차를 피해서 길 가장자리를 걷는다.","その話題は避けたほうがいい。 / 그 화제는 피하는 게 좋다."],"동사 (動詞)"],[6,"負かす","まかす","이기다, 지게 하다",["兄を将棋で負かした。 / 형을 장기로 이겼다.","相手を言い負かす。 / 상대를 말로 이긴다.","強豪チームを負かした。 / 강호 팀을 꺾었다."],"동사 (動詞)"],[6,"片付く","かたづく","정리되다, 해결되다",["部屋がきれいに片付いた。 / 방이 깨끗하게 정리되었다.","仕事がやっと片付いた。 / 일이 드디어 끝났다.","問題はまだ片付いていない。 / 문제는 아직 해결되지 않았다."],"동사 (動詞)"],[6,"片付ける","かたづける","정리하다, 처리하다",["おもちゃを片付けなさい。 / 장난감을 정리해라.","食事の後、テーブルを片付けた。 / 식사 후 식탁을 치웠다.","今日中に仕事を片付ける。 / 오늘 중으로 일을 처리한다."],"동사 (動詞)"],[6,"保つ","たもつ","유지하다",["部屋の温度を一定に保つ。 / 방 온도를 일정하게 유지한다.","健康を保つために運動する。 / 건강을 유지하기 위해 운동한다.","冷静さを保つ。 / 냉정함을 유지한다."],"동사 (動詞)"],[6,"歩む","あゆむ","걷다, 나아가다",["彼は教師としての道を歩んできた。 / 그는 교사로서의 길을 걸어왔다.","二人で共に人生を歩む。 / 둘이서 함께 인생을 걸어간다.","平和への道を歩む。 / 평화로의 길을 나아간다."],"동사 (動詞)"],[6,"補う","おぎなう","보충하다, 보완하다",["不足した栄養をサプリで補う。 / 부족한 영양을 영양제로 보충한다.","欠点を努力で補う。 / 결점을 노력으로 보완한다.","赤字を貯金で補った。 / 적자를 저금으로 메웠다."],"동사 (動詞)"],[6,"崩す","くずす","무너뜨리다, 흐트러뜨리다",["体調を崩して休んだ。 / 몸 상태가 나빠져서 쉬었다.","一万円札を崩してください。 / 만 엔짜리 지폐를 바꿔 주세요.","足を崩して楽にしてください。 / 다리를 편히 하세요."],"동사 (動詞)"],[6,"崩れる","くずれる","무너지다",["大雨で山が崩れた。 / 큰비로 산이 무너졌다.","天気が崩れそうだ。 / 날씨가 나빠질 것 같다.","計画が崩れた。 / 계획이 무너졌다."],"동사 (動詞)"],[6,"訪れる","おとずれる","찾아오다, 방문하다",["毎年多くの観光客が京都を訪れる。 / 매년 많은 관광객이 교토를 방문한다.","ついに春が訪れた。 / 드디어 봄이 찾아왔다.","チャンスが訪れた。 / 기회가 찾아왔다."],"동사 (動詞)"],[6,"飽きる","あきる","질리다, 싫증 나다",["同じ料理に飽きた。 / 같은 요리에 질렸다.","彼はすぐ飽きる性格だ。 / 그는 금방 싫증 내는 성격이다.","何度見ても飽きない映画だ。 / 몇 번 봐도 질리지 않는 영화다."],"동사 (動詞)"],[6,"望む","のぞむ","바라다, 바라보다",["世界の平和を望む。 / 세계 평화를 바란다.","望んでいた仕事に就けた。 / 바라던 일을 하게 되었다.","窓から富士山を望む。 / 창문에서 후지산을 바라본다."],"동사 (動詞)"],[6,"埋める","うめる","묻다, 메우다",["庭に宝物を埋めた。 / 마당에 보물을 묻었다.","空欄を埋めてください。 / 빈칸을 채워 주세요.","赤字を埋める。 / 적자를 메운다."],"동사 (動詞)"],[6,"満たす","みたす","채우다, 충족하다",["コップに水を満たす。 / 컵에 물을 채운다.","条件を満たしていない。 / 조건을 충족하지 못했다.","お腹を満たす。 / 배를 채운다."],"동사 (動詞)"],[6,"黙る","だまる","침묵하다, 입을 다물다",["彼は黙ったまま何も言わなかった。 / 그는 입을 다문 채 아무 말도 하지 않았다.","黙って聞いてください。 / 조용히 들어 주세요.","黙っていてごめんね。 / 말하지 않아서 미안해."],"동사 (動詞)"],[6,"優れる","すぐれる","뛰어나다, 우수하다",["彼は運動能力に優れている。 / 그는 운동 능력이 뛰어나다.","優れた作品を選ぶ。 / 뛰어난 작품을 고른다.","気分が優れない。 / 기분이 좋지 않다."],"동사 (動詞)"],[6,"誘う","さそう","권하다, 꾀다, 불러일으키다",["友達を映画に誘った。 / 친구에게 영화 보러 가자고 했다.","彼の話は涙を誘った。 / 그의 이야기는 눈물을 자아냈다.","甘い言葉に誘われた。 / 달콤한 말에 넘어갔다."],"동사 (動詞)"],[6,"余る","あまる","남다",["料理が余ってしまった。 / 요리가 남아 버렸다.","時間が余ったので散歩した。 / 시간이 남아서 산책했다.","身に余る光栄です。 / 과분한 영광입니다."],"동사 (動詞)"],[6,"与える","あたえる","주다",["犬にえさを与える。 / 개에게 먹이를 준다.","その本は私に大きな影響を与えた。 / 그 책은 나에게 큰 영향을 주었다.","彼にチャンスを与えた。 / 그에게 기회를 주었다."],"동사 (動詞)"],[6,"養う","やしなう","기르다, 부양하다",["家族を養うために働く。 / 가족을 부양하기 위해 일한다.","読書で想像力を養う。 / 독서로 상상력을 기른다.","体力を養う。 / 체력을 기른다."],"동사 (動詞)"],[6,"抑える","おさえる","억누르다, 억제하다",["怒りを抑える。 / 분노를 억누른다.","出費を抑える。 / 지출을 억제한다.","感染の拡大を抑える。 / 감염 확대를 억제한다."],"동사 (動詞)"],[6,"頼る","たよる","의지하다",["親に頼らずに生活する。 / 부모에게 의지하지 않고 생활한다.","地図に頼って歩いた。 / 지도에 의지해서 걸었다.","困ったときは私を頼ってね。 / 곤란할 때는 나에게 의지해."],"동사 (動詞)"],[6,"絡む","からむ","얽히다, 엉키다, 시비 걸다",["糸が絡んでほどけない。 / 실이 엉켜서 풀리지 않는다.","この事件にはお金が絡んでいる。 / 이 사건에는 돈이 얽혀 있다.","酔った客に絡まれた。 / 취한 손님에게 시비가 걸렸다."],"동사 (動詞)"],[6,"冷やす","ひやす","식히다, 차게 하다",["ビールを冷やしておく。 / 맥주를 차게 해 둔다.","頭を冷やしてから考えよう。 / 머리를 식히고 나서 생각하자.","やけどをすぐに水で冷やす。 / 화상을 바로 물로 식힌다."],"동사 (動詞)"],[6,"励ます","はげます","격려하다",["落ち込んでいる友達を励ました。 / 우울해하는 친구를 격려했다.","みんなの応援に励まされた。 / 모두의 응원에 힘을 얻었다.","先生はいつも生徒を励ましている。 / 선생님은 항상 학생을 격려하신다."],"동사 (動詞)"],[6,"騙す","だます","속이다",["老人を騙してお金を取った。 / 노인을 속여서 돈을 빼앗았다.","騙されたと気づいた。 / 속았다는 것을 깨달았다.","子どもを騙すような話だ。 / 어린애 속이는 듯한 이야기다."],"동사 (動詞)"],[6,"いい加減な","いいかげんな","대충인, 무책임한",["いい加減な仕事をするな。 / 대충 일하지 마라.","彼の話はいい加減だ。 / 그의 이야기는 무책임하다.","いい加減にしなさい。 / 적당히 좀 해라."],"な형용사"],[6,"意外な","いがいな","의외의",["意外な結果に驚いた。 / 의외의 결과에 놀랐다.","彼に意外な一面があった。 / 그에게 의외의 일면이 있었다.","試験は意外に簡単だった。 / 시험은 의외로 쉬웠다."],"な형용사"],[6,"過激な","かげきな","과격한",["過激な発言が問題になった まる。 / 밤의 어둠이 깊어진다."],"명사"],[7,"陰","かげ","그늘, 뒤",["木の陰で休む。 / 나무 그늘에서 쉰다.","陰で人の悪口を言うな。 / 뒤에서 남의 험담을 하지 마라.","彼の成功の陰には妻の支えがあった。 / 그의 성공 뒤에는 아내의 지지가 있었다."],"명사"],[7,"渦","うず","소용돌이",["川に大きな渦ができた。 / 강에 큰 소용돌이가 생겼다.","事件の渦に巻き込まれた。 / 사건의 소용돌이에 휘말렸다.","会場は興奮の渦に包まれた。 / 행사장은 흥분의 도가니에 휩싸였다."],"명사"],[7,"鉛","なまり","납",["鉛は重い金属だ。 / 납은 무거운 금속이다.","疲れて体が鉛のように重い。 / 지쳐서 몸이 납처럼 무겁다.","昔の水道管には鉛が使われていた。 / 옛날 수도관에는 납이 사용되었다."],"명사"],[8,"沖","おき","앞바다",["沖に船が見える。 / 앞바다에 배가 보인다.","沖まで泳いでいくのは危ない。 / 앞바다까지 헤엄쳐 가는 것은 위험하다.","台風が沖を通過した。 / 태풍이 앞바다를 통과했다."],"명사"],[8,"芽","め","싹",["春になって木に芽が出た。 / 봄이 되어 나무에 싹이 텄다.","才能の芽を育てる。 / 재능의 싹을 키운다.","問題の芽を早めにつむ。 / 문제의 싹을 일찍 자른다."],"명사"],[8,"核","かく","핵",["問題の核に触れる。 / 문제의 핵심에 닿는다.","核兵器をなくす運動だ。 / 핵무기를 없애는 운동이다.","細胞の核を観察する。 / 세포의 핵을 관찰한다."],"명사"],[8,"角","つの/かど","뿔, 모서리, 모퉁이",["牛には角がある。 / 소에게는 뿔이 있다.","次の角を右に曲がってください。 / 다음 모퉁이를 오른쪽으로 돌아 주세요.","机の角に頭をぶつけた。 / 책상 모서리에 머리를 부딪쳤다."],"명사"],[8,"株","かぶ","주식, 그루",["株を買って損をした。 / 주식을 사서 손해를 봤다.","彼は会社の株を持っている。 / 그는 회사의 주식을 가지고 있다.","大きな木の株に座った。 / 큰 나무 그루터기에 앉았다."],"명사"],[8,"幹","みき","줄기(나무의 단단한 줄기)",["この木は幹が太い。 / 이 나무는 줄기가 굵다.","幹に名前を彫る。 / 나무줄기에 이름을 새긴다.","幹から枝が伸びている。 / 줄기에서 가지가 뻗어 있다."],"명사"],[8,"管","くだ","관, 파이프",["細い管を通して水を送る。 / 가느다란 관을 통해 물을 보낸다.","病院で管につながれていた。 / 병원에서 관을 달고 있었다.","ガラスの管を割ってしまった。 / 유리관을 깨 버렸다."],"명사"],[8,"癌","がん","암",["父は胃癌の手術を受けた。 / 아버지는 위암 수술을 받으셨다.","癌は早期発見が大切だ。 / 암은 조기 발견이 중요하다.","彼はこのチームの癌だ。 / 그는 이 팀의 암적인 존재다."],"명사"],[8,"器","うつわ","그릇",["料理をきれいな器に盛る。 / 요리를 예쁜 그릇에 담는다.","彼は社長の器ではない。 / 그는 사장의 그릇이 아니다.","器が大きい人だ。 / 그릇이 큰 사람이다."],"명사"],[8,"技","わざ","기술, 기",["柔道の技を覚える。 / 유도 기술을 익힌다.","職人の技に感動した。 / 장인의 솜씨에 감동했다.","技を磨くために練習する。 / 기술을 연마하기 위해 연습한다."],"명사"],[8,"脚","あし","다리",["机の脚が一本折れた。 / 책상 다리 하나가 부러졌다.","彼女は脚が長い。 / 그녀는 다리가 길다.","いすの脚を直す。 / 의자 다리를 고친다."],"명사"],[8,"逆","ぎゃく","반대, 역",["予想とは逆の結果になった。 / 예상과는 반대의 결과가 되었다.","逆の方向に歩いてしまった。 / 반대 방향으로 걸어 버렸다.","逆に質問された。 / 거꾸로 질문을 받았다."],"명사"],[8,"丘","おか","언덕",["丘の上から町を見下ろす。 / 언덕 위에서 마을을 내려다본다.","家は丘の上にある。 / 집은 언덕 위에 있다.","小さな丘を越えると海が見えた。 / 작은 언덕을 넘자 바다가 보였다."],"명사"],[8,"弓","ゆみ","활",["弓で矢を射る。 / 활로 화살을 쏜다.","弓道部に入った。 / 궁도부에 들어갔다.","弓のように体を曲げる。 / 활처럼 몸을 구부린다."],"명사"],[8,"筋","すじ","근육, 줄기, 줄거리, 이치",["首の筋を痛めた。 / 목 근육을 다쳤다.","話の筋がわからない。 / 이야기의 줄거리를 모르겠다.","それは筋が通らない話だ。 / 그것은 이치에 맞지 않는 이야기다."],"명사"],[8,"恵","めぐみ","은혜, 혜택",["自然の恵みに感謝する。 / 자연의 은혜에 감사한다.","恵みの雨が降った。 / 단비가 내렸다.","海の恵みを味わう。 / 바다의 선물을 맛본다."],"명사"],[8,"茎","くき","줄기(풀의 약한 줄기)",["花の茎を切って花瓶に入れる。 / 꽃의 줄기를 잘라 꽃병에 넣는다.","この植物は茎が細い。 / 이 식물은 줄기가 가늘다.","茎が折れてしまった。 / 줄기가 꺾여 버렸다."],"명사"],[8,"芸","げい","예술, 재능, 재주",["彼は芸が細かい。 / 그는 솜씨가 섬세하다.","犬に芸を教える。 / 개에게 재주를 가르친다.","芸の道は厳しい。 / 예술의 길은 험난하다."],"명사"],[8,"穴","あな","구멍",["靴下に穴があいた。 / 양말에 구멍이 났다.","道に大きな穴がある。 / 길에 큰 구멍이 있다.","恥ずかしくて穴があったら入りたい。 / 부끄러워서 쥐구멍에라도 들어가고 싶다."],"명사"],[8,"件","けん","건, 사항",["例の件はどうなりましたか。 / 그 건은 어떻게 되었습니까?","その件については後で話します。 / 그 건에 대해서는 나중에 이야기하겠습니다.","今日は三件の相談があった。 / 오늘은 세 건의 상담이 있었다."],"명사"],[8,"源","みなもと","근원, 원천",["この川の源は山にある。 / 이 강의 근원은 산에 있다.","健康は幸せの源だ。 / 건강은 행복의 원천이다.","問題の源を探る。 / 문제의 근원을 찾는다."],"명사"],[8,"股","また","사타구니, 가랑이",["股を広げて座る。 / 다리를 벌리고 앉는다.","世界を股にかけて活躍する。 / 세계를 누비며 활약한다.","木の股に鳥の巣がある。 / 나무 가랑이에 새 둥지가 있다."],"명사"],[8,"公","おおやけ","공적인 것, 공개",["その事実はまだ公になっていない。 / 그 사실은 아직 공개되지 않았다.","公の場では言葉に気をつける。 / 공적인 자리에서는 말을 조심한다.","事件が公になった。 / 사건이 세상에 알려졌다."],"명사"],[8,"垢","あか","때",["お風呂で垢を落とす。 / 목욕탕에서 때를 민다.","服の襟に垢がついている。 / 옷깃에 때가 묻어 있다.","都会の垢にまみれる。 / 도시의 때에 찌든다."],"명사"],[8,"溝","みぞ","도랑, 홈, 간격",["道の横に溝がある。 / 길 옆에 도랑이 있다.","二人の間に溝ができた。 / 두 사람 사이에 틈이 생겼다.","タイヤの溝がすり減った。 / 타이어 홈이 닳았다."],"명사"],[8,"綱","つな","밧줄",["運動会で綱引きをした。 / 운동회에서 줄다리기를 했다.","船を綱でつなぐ。 / 배를 밧줄로 묶는다.","彼が最後の頼みの綱だ。 / 그가 마지막 희망이다."],"명사"],[8,"頃","ころ","무렵, 쯤",["子どもの頃、よくここで遊んだ。 / 어렸을 때 자주 여기서 놀았다.","三時頃に行きます。 / 3시쯤에 가겠습니다.","桜の咲く頃に会いましょう。 / 벚꽃이 필 무렵에 만납시다."],"명사"],[8,"根","ね","뿌리",["木の根が地面から出ている。 / 나무뿌리가 땅에서 나와 있다.","問題の根は深い。 / 문제의 뿌리는 깊다.","彼は根はいい人だ。 / 그는 본성은 좋은 사람이다."],"명사"],[8,"魂","たましい","혼, 영혼",["作品に魂を込める。 / 작품에 혼을 담는다.","死者の魂を慰める。 / 죽은 사람의 영혼을 위로한다.","職人の魂を感じる。 / 장인의 혼을 느낀다."],"명사"],[8,"際","きわ","가장자리, 경계",["窓際の席に座る。 / 창가 자리에 앉는다.","崖の際に立つのは危ない。 / 절벽 가장자리에 서는 것은 위험하다.","水際で感染を防ぐ。 / 입국 단계에서 감염을 막는다."],"명사"],[8,"柵","さく","울타리",["庭の周りに柵を作った。 / 마당 주위에 울타리를 만들었다.","柵を越えて入らないでください。 / 울타리를 넘어 들어가지 마세요.","牛が柵の中にいる。 / 소가 울타리 안에 있다."],"명사"],[8,"策","さく","대책, 방책",["解決策を考える。 / 해결책을 생각한다.","何か策はありますか。 / 무슨 방책이 있습니까?","策を練って試合に臨む。 / 전략을 세워 경기에 임한다."],"명사"],[8,"札","ふだ/さつ","표, 팻말, 지폐",["入り口に名札をかける。 / 입구에 명찰을 건다.","千円札を両替する。 / 천 엔짜리 지폐를 바꾼다.","店の前に「準備中」の札が出ている。 / 가게 앞에 '준비 중' 팻말이 나와 있다."],"명사"],[8,"志","こころざし","뜻, 포부",["高い志を持って留学する。 / 높은 뜻을 품고 유학한다.","志を同じくする仲間だ。 / 뜻을 같이하는 동료다.","志半ばで亡くなった。 / 뜻을 다 이루지 못하고 세상을 떠났다."],"명사"],[8,"紫","むらさき","보라색",["紫の花が咲いている。 / 보라색 꽃이 피어 있다.","空が紫に染まった。 / 하늘이 보랏빛으로 물들었다.","紫のドレスを着ていた。 / 보라색 드레스를 입고 있었다."],"명사"],[8,"雌","めす","암컷",["この猫は雌だ。 / 이 고양이는 암컷이다.","雌の鳥は地味な色をしている。 / 암컷 새는 수수한 색을 띠고 있다.","雄と雌を見分ける。 / 수컷과 암컷을 구별한다."],"명사"],[8,"侍","さむらい","사무라이",["昔、日本には侍がいた。 / 옛날 일본에는 사무라이가 있었다.","侍の映画を見た。 / 사무라이 영화를 봤다.","侍のような生き方をする。 / 사무라이 같은 삶을 산다."],"명사"],[8,"軸","じく","축, 중심",["チームの軸となる選手だ。 / 팀의 중심이 되는 선수다.","地球は軸を中心に回っている。 / 지구는 축을 중심으로 돌고 있다.","考え方の軸がぶれない。 / 생각의 중심이 흔들리지 않는다."],"명사"],[8,"主","ぬし","주인, 주된 것",["この森の主と呼ばれる大きな木だ。 / 이 숲의 주인이라 불리는 큰 나무다.","落とし物の持ち主を探す。 / 분실물의 주인을 찾는다.","声の主は誰だろう。 / 목소리의 주인공은 누구일까."],"명사"],[8,"種","しゅ/たね","종류, 씨앗",["庭にひまわりの種をまいた。 / 마당에 해바라기 씨를 뿌렸다.","絶滅危惧種を保護する。 / 멸종 위기종을 보호한다.","それは悩みの種だ。 / 그것은 고민거리다."],"명사"],[8,"趣","おもむき","정취, 멋",["趣のある古い町並みだ。 / 정취 있는 옛 거리 풍경이다.","この庭には独特の趣がある。 / 이 정원에는 독특한 멋이 있다.","話の趣はわかった。 / 이야기의 취지는 알았다."],"명사"],[8,"獣","けもの","짐승",["森の中で獣の声がした。 / 숲속에서 짐승 소리가 났다.","獣のようにほえた。 / 짐승처럼 울부짖었다.","獣道を歩く。 / 짐승이 다니는 길을 걷는다."],"명사"],[8,"術","すべ","방법, 수단",["なす術もなかった。 / 어찌할 방법도 없었다.","生きる術を学ぶ。 / 살아가는 방법을 배운다.","連絡する術がない。 / 연락할 수단이 없다."],"명사"],[8,"盾","たて","방패",["盾で身を守る。 / 방패로 몸을 지킨다.","法律を盾にして断る。 / 법률을 방패 삼아 거절한다.","彼は私の盾になってくれた。 / 그는 나의 방패가 되어 주었다."],"명사"],[8,"沼","ぬま","늪",["沼に落ちないように気をつけて。 / 늪에 빠지지 않도록 조심해.","沼にカエルがたくさんいる。 / 늪에 개구리가 많이 있다.","趣味の沼にはまった。 / 취미의 늪에 빠졌다."],"명사"],[8,"証","あかし","증거, 증명",["これは二人の愛の証だ。 / 이것은 두 사람의 사랑의 증표다.","努力の証として賞をもらった。 / 노력의 증거로 상을 받았다.","身の証を立てる。 / 결백을 증명한다."],"명사"],[8,"丈","たけ","길이, 키",["スカートの丈を短くする。 / 치마 길이를 짧게 한다.","背丈が伸びた。 / 키가 컸다.","思いの丈を伝えた。 / 마음속 생각을 전부 전했다."],"명사"],[8,"刃","は","칼날",["包丁の刃が欠けた。 / 식칼 날이 이가 빠졌다.","刃物の扱いに注意する。 / 칼 다루는 것에 주의한다.","刃を研いでよく切れるようにする。 / 날을 갈아서 잘 들게 한다."],"명사"],[8,"跡","あと","흔적, 자국",["雪の上に足の跡が残っている。 / 눈 위에 발자국이 남아 있다.","城の跡を見学した。 / 성터를 견학했다.","手術の跡が残った。 / 수술 자국이 남았다."],"명사"],[8,"節","ふし","마디, 부분",["竹には節がある。 / 대나무에는 마디가 있다.","歌の一節を口ずさむ。 / 노래의 한 소절을 흥얼거린다.","彼の話には疑わしい節がある。 / 그의 이야기에는 의심스러운 부분이 있다."],"명사"],[8,"禅","ぜん","선(불교)",["京都の寺で禅を体験した。 / 교토의 절에서 선을 체험했다.","禅の考え方を学ぶ。 / 선의 사고방식을 배운다.","座禅を組んで心を落ち着ける。 / 좌선을 하며 마음을 가라앉힌다."],"명사"],[8,"巣","す","둥지, 집",["木の上に鳥の巣がある。 / 나무 위에 새 둥지가 있다.","蜂の巣を見つけた。 / 벌집을 발견했다.","子どもたちが巣立っていった。 / 아이들이 둥지를 떠나 독립했다."],"명사"],[8,"霜","しも","서리",["朝、畑に霜が降りていた。 / 아침에 밭에 서리가 내려 있었다.","霜で野菜がだめになった。 / 서리로 채소가 못 쓰게 되었다.","窓に霜がついている。 / 창문에 서리가 끼어 있다."],"명사"],[8,"蔵","くら","창고, 곳간",["古い蔵を改装してカフェにした。 / 오래된 창고를 개조해서 카페로 만들었다.","蔵の中に宝物がしまってある。 / 곳간 안에 보물이 보관되어 있다.","酒蔵を見学した。 / 양조장을 견학했다."],"명사"],[8,"対","つい","대, 짝",["この花瓶は二つで一対だ。 / 이 꽃병은 두 개가 한 쌍이다.","対になった茶碗を買った。 / 짝을 이룬 밥그릇을 샀다.","左右対の飾りがある。 / 좌우 한 쌍의 장식이 있다."],"명사"],[8,"端","はし","끝, 가장자리",["道の端を歩く。 / 길 가장자리를 걷는다.","紙の端を折る。 / 종이 끝을 접는다.","端から端まで探した。 / 끝에서 끝까지 찾았다."],"명사"],[8,"値","あたい","값, 가치",["一見に値する景色だ。 / 한번 볼 가치가 있는 경치다.","xの値を求めなさい。 / x의 값을 구하시오.","称賛に値する行動だ。 / 칭찬받을 만한 행동이다."],"명사"],[8,"恥","はじ","부끄러움, 수치",["人前で恥をかいた。 / 사람들 앞에서 창피를 당했다.","知らないのは恥ではない。 / 모르는 것은 부끄러운 일이 아니다.","親に恥をかかせたくない。 / 부모님께 창피를 드리고 싶지 않다."],"명사"],[8,"宙","ちゅう","공중, 허공",["ボールが宙に舞った。 / 공이 공중으로 날아올랐다.","計画は宙に浮いたままだ。 / 계획은 붕 뜬 채로 있다.","宙返りをする。 / 공중제비를 돈다."],"명사"],[8,"潮","しお","조수, 바닷물",["潮が引いて貝が拾えた。 / 물이 빠져서 조개를 주울 수 있었다.","潮の流れが速い。 / 조류가 빠르다.","潮の香りがする。 / 바다 냄새가 난다."],"명사"],[8,"腸","ちょう","장, 내장",["腸の調子が悪い。 / 장 상태가 좋지 않다.","ヨーグルトは腸にいい。 / 요구르트는 장에 좋다.","腸の検査を受けた。 / 장 검사를 받았다."],"명사"],[8,"頂","いただき","정상, 꼭대기",["山の頂に雪が残っている。 / 산꼭대기에 눈이 남아 있다.","頂を目指して登る。 / 정상을 목표로 오른다.","頂から朝日を見た。 / 정상에서 아침 해를 봤다."],"명사"],[8,"的","まと","과녁, 목표, 대상",["矢が的に当たった。 / 화살이 과녁에 맞았다.","彼は批判の的になった。 / 그는 비판의 대 /* ---------- data ---------- */
let words = [], byId = new Map(), byDay = new Map(), stats = {}, sessions = {}, soundOn = true, range = null, layout = 'A';

function parseExample(s){
  s = String(s || '').trim();
  if (!s) return null;
  const parts = s.split(/\s*(?:\/|／|\r?\n)\s*/);
  return {jp: parts[0], ko: parts.slice(1).join(' / ')};
}
function detectPos(kana, posText){
  const t = String(posText || '');
  if (/する|サ変/.test(t) || /（する）|\(する\)/.test(kana)) return 's';
  if (/な形|な형/.test(t) || /（な）|\(な\)/.test(kana)) return 'na';
  if (/イ形|い形|い형/.test(t)) return 'i';
  if (/動詞|동사/.test(t)) return 'v';
  if (/副詞|부사/.test(t)) return 'adv';
  if (/接続|접속/.test(t)) return 'c';
  if (/敬語|경어/.test(t)) return 'k';
  if (/表現|표현/.test(t)) return 'e';
  return 'n';
}
function normalize(day, no, kanji, kana, meaning, exs, posText){
  kanji = String(kanji || '').trim(); kana = String(kana || '').trim(); meaning = String(meaning || '').trim();
  const pos = detectPos(kana, posText);
  kana = kana.replace(/\s*[（(]\s*(する|な)\s*[)）]\s*/g, '').trim();
  if (kanji === kana) kanji = '';
  return {id: day + '|' + kana + '|' + kanji, day, no: no || 0, kanji, kana, meaning, pos,
          examples: (exs || []).map(parseExample).filter(Boolean).slice(0, 3)};
}
function reindex(){
  byId = new Map(words.map(w => [w.id, w]));
  byDay = new Map();
  words.forEach(w => { if (!byDay.has(w.day)) byDay.set(w.day, []); byDay.get(w.day).push(w); });
}
function get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('저장 공간이 부족해 저장하지 못했습니다'); } }
function load(){
  words = get('jv_words_ed1a5179', null);
  if (!Array.isArray(words)){ const cnt = {}; words = SAMPLE.map(r => { cnt[r[0]] = (cnt[r[0]] || 0) + 1; return normalize(r[0], cnt[r[0]], r[1], r[2], r[3], r[4], r[5]); }); put('jv_words_ed1a5179', words); }
  stats = get('jv2_stats', {}) || {};
  sessions = get('jv2_sessions', {}) || {};
  soundOn = get('jv2_sound', true);
  range = get('jv2_range', null);
  layout = get('jv2_layout', 'A');
  flashSaves = get('jv2_flash', {}) || {};
  reindex();
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const num = n => Number(n).toLocaleString('ko-KR');
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- speech & sound ---------- */
let AC = null, activeTones = [];
function stopSpeak(){
  clearTimeout(autoT);
  try { if (window.Android && Android.stop) Android.stop(); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  try { activeTones.forEach(o => { try { o.stop(); } catch(e){} }); activeTones = []; } catch(e){}
}
let autoT = null;
function stopVoice(){
  try { if (window.Android && Android.stop) Android.stop(); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
}
function speak(text){
  stopVoice();
  try {
    if (window.Android && Android.canSpeak()){ Android.speak(text); return; }
    if (window.speechSynthesis){
      const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u); return;
    }
  } catch(e){}
  toast('일본어 음성을 사용할 수 없습니다. 기기 TTS 설정을 확인하세요');
}
function ensureAudio(){
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function unlockAudio(){
  const ac = ensureAudio(); if (!ac) return;
  try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch(e){}
}
['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, {passive:true}));
function tone(f, start, dur, type, vol, f2){
  const t = AC.currentTime + start, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  activeTones.push(o); o.onended = () => { activeTones = activeTones.filter(x => x !== o); };
}
function playKind(kind){
  if (kind === 'ok'){ tone(880, 0, .16, 'sine', .4); tone(1318.5, .09, .38, 'sine', .4); }
  else if (kind === 'ng'){ tone(196, 0, .24, 'triangle', .55, 150); tone(147, .16, .34, 'triangle', .55, 110); }
  else if (kind === 'grad'){ [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, .35 + i * .09, .3, 'sine', .3)); }
  else if (kind === 'done'){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .12, .45, 'sine', .35)); }
}
function sfx(kind){
  if (!soundOn) return;
  const ac = ensureAudio(); if (!ac) return;
  try { if (ac.state === 'running') playKind(kind); else ac.resume().then(() => playKind(kind)).catch(() => {}); } catch(e){}
}
function toggleSound(){ soundOn = !soundOn; put('jv2_sound', soundOn); $('#sndBtn').textContent = soundOn ? '🔔' : '🔕'; toast(soundOn ? '효과음을 켰습니다' : '효과음을 껐습니다'); if (soundOn) sfx('ok'); }

async function pickRange(title){

  if (!days.length){ modal('단어가 없습니다', '엑셀로 단어를 먼저 불러와 주세요.', [['확인', 1, 'pri']]); return null; }
  const def = range && days.includes(range.from) ? range : {from: days[0], to: days[0]};
  const opts = sel => days.map(d => `<option value="${d}" ${d === sel ? 'selected' : ''}>${dayLabel(d)}</option>`).join('');
  const p = modal(title || '몇 일차부터 몇 일차까지 학습할까요?', `
    <div class="sel"><select id="rFrom">${opts(def.from)}</select><span>~</span><select id="rTo">${opts(def.to)}</select></div>

    [['이 범위로 시작', 'go', 'pri'], ['취소', null]]);
  const f = $('#rFrom'), t = $('#rTo');
  const upd = () => {
    let a = +f.value, b = +t.value; if (b < a){ b = a; t.value = a; }
    const ws = rangeWords({from:a, to:b}), done = ws.filter(isStudied).length;

}

async function begin(key, ws, label, kind, keepOrder, fresh){
  if (words.length < 4){ modal('단어가 부족합니다', '4지선다 문제를 만들려면 단어가 4개 이상 필요합니다.', [['확인', 1, 'pri']]); return; }

    if (v === 'go') return runSession(key);
    if (v !== 'new') return;
  }
  const ids = ws.map(w => w.id);
  sessions[key] = {ids: keepOrder ? ids : shuffle(ids), idx:0, o:0, x:0, wrong:[], label, kind};

}

/* ---------- quiz ---------- */
let Q = {key:'', cur:null, answered:false};

function buildQuestion(w){
  const fields = ['kana', 'meaning']; if (w.kanji) fields.unshift('kanji');
  const pairs = [];
  fields.forEach(p => fields.forEach(a => { if (p !== a) pairs.push([p, a]); }));
  for (const [p, a] of shuffle(pairs)){
    const seen = new Set([w[a]]);
    let cands = [];
    // 같은 일차 단어를 먼저 보기로 사용 → 헷갈리는 보기
    const pool = shuffle(dayWords(w.day).slice()).concat(shuffle(words.slice()));
    for (const o of pool){
      if (o.id === w.id || !o[a] || o[p] === w[p] || seen.has(o[a])) continue;
      seen.add(o[a]); cands.push(o);
      if (cands.length >= 60) break;
    }
    if (cands.length < 3) continue;
    if (a !== 'meaning'){
      const L = w[a].length;
      cands = cands.sort((x, y) => Math.abs(x[a].length - L) - Math.abs(y[a].length - L)).slice(0, 8);
    }
    const opts = shuffle([w[a], ...shuffle(cands).slice(0, 3).map(o => o[a])]);
    return {w, p, a, opts, correct: opts.indexOf(w[a])};
  }
  return null;
}
function updateTop(){
  const S = sessions[Q.key];
  $('#qMode').textContent = S.label;
  const shown = Math.min(S.idx + (Q.answered ? 0 : 1), S.ids.length);
  $('#qNum').textContent = num(shown); $('#qTot').textContent = num(S.ids.length);
  $('#qBar').style.width = (S.idx / S.ids.length * 100) + '%';
  $('#scO').textContent = S.o; $('#scX').textContent = S.x;
}
function nextQuestion(){
  stopSpeak();
  const S = sessions[Q.key];
  if (!S) return goHome();
  let q = null;
  while (S.idx < S.ids.length){
    const w = byId.get(S.ids[S.idx]);
    if (w && (q = buildQuestion(w))) break;
    S.idx++;
  }
  if (!q) return finishSession();
  Q.cur = q; Q.answered = false;
  updateTop();
  $('#qLabel').innerHTML = `${FIELD_NAME[q.p]} → ${ASK_LABEL[q.a]}`;
  const pr = $('#qPrompt'); pr.className = 'prompt ' + q.p; pr.textContent = q.w[q.p];
  $('#qPos').innerHTML = posBadge(q.w);
  const sp = $('#qSpeak');
  sp.style.display = (q.p !== 'meaning' && q.a !== 'kana') ? '' : 'none';
  sp.onclick = () => speak(q.w.kana);
  const box = $('#opts'); box.innerHTML = '';
  q.opts.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (q.a === 'kanji' ? ' kanji' : '');
    b.dataset.n = i + 1; b.textContent = t;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  $('#result').className = 'result'; $('#result').innerHTML = '';
  window.scrollTo(0, 0);
}
function highlight(jp, w){
  const s = esc(jp);
  for (const k of [w.kanji, w.kana].filter(Boolean)){
    let t = k;
    if (!jp.includes(t) && t.length > 1) t = t.slice(0, -1);
    if (t && jp.includes(t)) return s.split(esc(t)).join('<b>' + esc(t) + '</b>');
  }
  return s;
}
function answer(i){
  if (Q.answered) return;
  Q.answered = true;
  const S = sessions[Q.key], q = Q.cur, ok = i === q.correct, s = st(q.w.id);
  const wasNote = s.note;
  let notice = '';
  if (ok){
    s.c++; S.o++;
    if (s.note){
      s.streak++;
      if (s.streak >= 2){ s.note = false; s.streak = 0;
        notice = `<div class="notice grad"><span class="ic">🎓</span><div><b>오답노트 졸업!</b><p>2번 연속으로 맞혀서 오답노트에서 뺐어요.</p></div></div>`;
      } else {
        notice = `<div class="notice half"><span class="ic">✊</span><div><b>오답노트 탈출까지 1번 <span class="dots"><i class="f"></i><i></i></span></b><p>다음에 한 번 더 맞히면 오답노트에서 빠져요.</p></div></div>`;
      }
    }
  } else {
    s.w++; S.x++; s.note = true; s.streak = 0; S.wrong.push(q.w.id);

/* ---------- excel import ---------- */
function parseWorkbook(ab){
  const wb = XLSX.read(ab, {type:'array'});
  const out = [], seen = new Set();
  wb.SheetNames.forEach((name, si) => {
    if (/안내|방법|검수|help|guide/i.test(name)) return;
    const m = name.match(/(\d+)/);
    const day = m ? +m[1] : 0;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:false});
    if (!rows.length) return;
    // 머리글로 열 위치 찾기 (없으면 A 한자, B 히라가나, C 뜻, D~F 예문)
    const h = rows[0].map(v => String(v).trim());
    const find = re => h.findIndex(x => re.test(x));
    let col = {no:find(/번호|no/i), kanji:find(/한자|漢字|kanji/i), kana:find(/히라가나|ひらがな|읽기|読み/i), pos:find(/품사|品詞/), mean:find(/뜻|의미|意味/)};
    const exCols = h.map((x, i) => /예문|例文/.test(x) ? i : -1).filter(i => i >= 0);
    const hasHeader = col.kana >= 0 && col.mean >= 0;
    if (!hasHeader) col = {no:-1, kanji:0, kana:1, pos:-1, mean:2};
    const ex = hasHeader ? exCols : [3, 4, 5];
    rows.slice(hasHeader ? 1 : 0).forEach((r, i) => {
      const c = r.map(v => String(v == null ? '' : v).trim());
      const kana = c[col.kana], mean = c[col.mean];
      if (!kana || !mean) return;
      const w = normalize(day, col.no >= 0 ? (+c[col.no] || i + 1) : i + 1, col.kanji >= 0 ? c[col.kanji] : '', kana, mean, ex.map(k => c[k]), col.pos >= 0 ? c[col.pos] : '');
      if (seen.has(w.id)) return;
      seen.add(w.id); out.push(w);
    });
  });
  return out;
}
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  toast('엑셀을 읽는 중입니다…');
  const rd = new FileReader();
  rd.onload = async () => {
    let list;
    try { list = parseWorkbook(new Uint8Array(rd.result)); }
    catch(err){ modal('파일을 읽을 수 없습니다', '엑셀(.xlsx) 파일인지 확인해 주세요.', [['확인', 1, 'pri']]); return; }
    if (!list.length){ modal('단어를 찾지 못했습니다', '히라가나와 뜻이 채워진 줄이 없습니다. 형식을 확인해 주세요.', [['확인', 1, 'pri']]); return; }
    const days = [...new Set(list.map(w => w.day))].sort((a, b) => a - b);
    const exCnt = list.filter(w => w.examples.length).length;
    const v = await modal(`단어 ${num(list.length)}개를 찾았습니다`,
      `${days.length}개 일차 (${days.map(dayLabel).slice(0, 6).join(', ')}${days.length > 6 ? ' …' : ''})<br>예문이 있는 단어 ${num(exCnt)}개<br>같은 단어가 이미 있으면 새 내용으로 바뀌고, 학습 기록은 유지됩니다.`,
      [['기존 단어에 추가', 'add', 'pri'], ['기존 단어를 지우고 교체', 'replace'], ['취소', null]]);
    if (!v) return;
    if (v === 'replace') words = list;
    else { const map = new Map(words.map(w => [w.id, w])); list.forEach(w => map.set(w.id, w)); words = [...map.values()]; }

    saveWords(); renderHome();
    toast(`${num(list.length)}개 단어를 불러왔습니다 · 전체 ${num(words.length)}개`);
  };
  rd.readAsArrayBuffer(f);
});
